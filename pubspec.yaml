name: snorec
description: "Record sleep noises overnight — snores, coughs, and sleep-talking. Classify, replay, share."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  record: ^6.0.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  intl: ^0.19.0
  tflite_flutter: ^0.12.1
  wakelock_plus: ^1.2.8
  uuid: ^4.5.0
  package_info_plus: ^9.0.1
  archive: ^4.0.9
  flutter_onnxruntime: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/snorec.png"
  # Adaptive foreground is padded to keep the logo in the inner ~66% safe
  # zone; without this the launcher's circular mask crops the edges and the
  # icon looks shrunken inside a big white circle on Android 8+.
  adaptive_icon_foreground: "assets/brand/snorec_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#141615"
  adaptive_icon_monochrome: "assets/brand/snorec_monochrome.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - assets/models/
    - assets/fonts/OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
