org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Kotlin's relative-path incremental cache fails when the Windows Pub cache
# and checkout are on different drives. Keep the small project build portable.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
